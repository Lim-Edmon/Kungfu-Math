<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Kungfu Math">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="45%" stop-color="#ff8a50"/>
      <stop offset="100%" stop-color="#d84315"/>
    </linearGradient>
    <linearGradient id="face" x1="30%" y1="20%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffcc80"/>
    </linearGradient>
    <linearGradient id="robe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffe082"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#bf360c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- outer disc -->
  <circle cx="64" cy="64" r="62" fill="url(#ring)"/>
  <circle cx="64" cy="64" r="54" fill="#fff3e0"/>
  <circle cx="64" cy="64" r="50" fill="#1a237e" opacity="0.06"/>

  <!-- soft mountain hint -->
  <path d="M18 88 Q40 62 58 78 Q72 58 96 82 L110 96 L18 96 Z" fill="#5c6bc0" opacity="0.12"/>

  <!-- staff behind -->
  <g transform="rotate(-28 36 78)" filter="url(#soft)">
    <rect x="30" y="42" width="8" height="58" rx="3" fill="#6d4c41"/>
    <rect x="29" y="40" width="10" height="6" rx="2" fill="#8d6e63"/>
  </g>

  <!-- chibi head + robe (simple icon) -->
  <g filter="url(#soft)">
    <!-- body -->
    <ellipse cx="64" cy="98" rx="22" ry="12" fill="url(#robe)"/>
    <path d="M46 78 Q48 92 64 96 Q80 92 82 78 Z" fill="url(#robe)"/>
    <!-- head -->
    <circle cx="64" cy="56" r="24" fill="url(#face)"/>
    <!-- hair bun -->
    <circle cx="64" cy="32" r="10" fill="#3e2723"/>
    <path d="M42 52 Q44 28 64 26 Q84 28 86 52 Q78 40 64 38 Q50 40 42 52 Z" fill="#3e2723"/>
    <!-- headband -->
    <path d="M44 48 Q64 42 84 48" stroke="#e53935" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="55" cy="56" rx="3.2" ry="4" fill="#212121"/>
    <ellipse cx="73" cy="56" rx="3.2" ry="4" fill="#212121"/>
    <circle cx="56.2" cy="54.5" r="1.1" fill="#fff"/>
    <circle cx="74.2" cy="54.5" r="1.1" fill="#fff"/>
    <!-- smile -->
    <path d="M56 66 Q64 72 72 66" stroke="#e53935" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="48" cy="62" rx="4" ry="2.2" fill="#ff8a80" opacity="0.45"/>
    <ellipse cx="80" cy="62" rx="4" ry="2.2" fill="#ff8a80" opacity="0.45"/>
  </g>

  <!-- math badge -->
  <g filter="url(#soft)">
    <circle cx="98" cy="96" r="20" fill="url(#badge)" stroke="#ff8f00" stroke-width="3"/>
    <!-- × and + combo -->
    <text x="98" y="102" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="800" fill="#e65100">×+</text>
  </g>

  <!-- small spark -->
  <circle cx="28" cy="36" r="3" fill="#fff59d"/>
  <circle cx="102" cy="34" r="2.5" fill="#fff59d"/>
</svg>
