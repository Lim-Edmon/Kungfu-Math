      #boot-splash img {
        width: 96px;

        object-fit: cover;
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);

      #boot-splash .boot-title {
        margin: 4px 0 0;

        font-weight: 800;

        letter-spacing: -0.02em;
      }
      #boot-splash .boot-sub {
        margin: 0;
        font-size: 0.95rem;
        color: #666;
      }
      #boot-splash .boot-copy {
        margin: 16px 0 0;

  <body>
    <div id="boot-splash" aria-live="polite">
      <img src="/logo.png" alt="Kungfu Math" width="96" height="96" />
      <p class="boot-title">Kungfu Math</p>
      <p class="boot-sub" id="boot-sub">Latih hitung ala pendekar</p>
      <p class="boot-copy">© Lim Edmon 2026</p>
    </div>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('kungfu-math-progress');
          var lang = 'id';
          if (raw) {
            var p = JSON.parse(raw);
            if (p && p.language === 'en') lang = 'en';
            else if (p && !p.languageChosen) {
              var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
              if (tz && tz.indexOf('Jakarta') < 0 && tz.indexOf('Makassar') < 0 && tz.indexOf('Jayapura') < 0) {
                lang = 'en';
              }
            }
          } else {
            var tz2 = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
            if (tz2 && tz2.indexOf('Jakarta') < 0 && tz2.indexOf('Makassar') < 0 && tz2.indexOf('Jayapura') < 0) {
              lang = 'en';
            }
          }
          if (lang === 'en') {
            var el = document.getElementById('boot-sub');
            if (el) el.textContent = 'Math like a hero';
            document.documentElement.lang = 'en';
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
  </body>
