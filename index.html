<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#c41e3a" />
    <meta name="description" content="Kungfu Math – Latih hitung cepat ala pendekar!" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kungfu Math" />
    <title>Kungfu Math</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #fff8e1;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.3s ease;
      }
      #boot-splash img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        object-fit: cover;
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      }
      #boot-splash .boot-title {
        margin: 4px 0 0;
        font-size: 1.6rem;
        font-weight: 800;
        color: #1a1a1a;
        letter-spacing: -0.02em;
      }
      #boot-splash .boot-sub {
        margin: 0;
        font-size: 0.95rem;
        color: #666;
      }
      #boot-splash .boot-copy {
        margin: 16px 0 0;
        font-size: 0.75rem;
        color: #999;
      }
      #boot-splash.boot-hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-live="polite">
      <img src="/logo.png" alt="Kungfu Math" width="96" height="96" />
      <p class="boot-title">Kungfu Math</p>
      <p class="boot-sub">Latih hitung ala pendekar</p>
      <p class="boot-copy">© Lim Edmon 2026</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
